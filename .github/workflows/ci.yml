name: CI

# Runs on every push (any branch — so work can be verified BEFORE it reaches main, which Vercel
# deploys to production) and on pull requests into main.
# To make production deployments depend on it, protect `main` in GitHub (Settings → Branches →
# require the "web" and "mobile" checks to pass before merging) and merge through pull requests —
# Vercel deploys whatever lands on main. See billing-web/docs/PRODUCTION_RUNBOOK.md §3.2.
on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: web (typecheck, migrations, build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: billing-web

    # Throwaway database: migrations are applied to an EMPTY Postgres and must reproduce
    # schema.prisma exactly. Never points at a real database.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: cafeos_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d cafeos_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/cafeos_ci
      # Build-time placeholders only (CI never starts the server, so production env validation
      # in instrumentation.ts does not run here).
      NEXTAUTH_SECRET: ci-only-not-a-real-secret-0123456789abcdef
      JWT_SECRET: ci-only-not-a-real-secret-fedcba9876543210
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: billing-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Prisma schema is valid
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Migrations apply cleanly to an empty database
        run: npx prisma migrate deploy

      - name: Migrations reproduce schema.prisma exactly (no drift)
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: TypeScript
        run: npx tsc --noEmit -p tsconfig.json

      - name: Production build
        run: npx next build

      # Advisory until the pre-existing lint debt (~446 findings, mostly no-explicit-any) is paid
      # down — reported in the job log, but does not fail the run.
      - name: Lint (advisory)
        continue-on-error: true
        run: npx eslint .

  mobile:
    name: mobile (analyze, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cafeos-app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the version the app is built and verified with (pubspec.lock: flutter >=3.35.0).
          flutter-version: 3.35.7
          channel: stable
          cache: true

      - name: Install
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
